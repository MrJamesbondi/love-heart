<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ถึงคนพิเศษของฉัน</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #060208;
      color: #ffe3e9;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    h1, footer {
      position: fixed;
      z-index: 1;
      width: 100%;
      text-align: center;
      pointer-events: none;
    }

    h1 {
      top: 5vh;
      margin: 0;
      font-size: clamp(22px, 4vw, 34px);
      text-shadow: 0 0 16px #ff174f;
    }

    footer {
      bottom: 5vh;
      font-size: clamp(14px, 2.5vw, 18px);
    }
  </style>
</head>

<body>
  <h1>ถึงคนพิเศษของฉัน 💌</h1>
  <canvas id="heart"></canvas>
  <footer>ขอบคุณที่เข้ามาเป็นความสุขของฉัน ❤️</footer>

  <script>
    const phrases = [
      "I love you",
      "Seni seviyorum",
      "Te amo",
      "Je t'aime",
      "Ich liebe dich",
      "Ti amo",
      "Eu te amo",
      "Я тебя люблю",
      "사랑해",
      "愛してる",
      "我爱你",
      "मैं तुमसे प्यार करता हूँ",
      "Σ' αγαπώ",
      "Ik hou van jou",
      "Jag älskar dig",
      "Kocham cię",
      "ฉันรักเธอ",
      "Anh yêu em",
      "Aku cinta kamu",
      "Я тебе кохаю"
    ];

    const canvas = document.getElementById("heart");
    const ctx = canvas.getContext("2d");

    let words = [];
    let startedAt = 0;
    let width = 0;
    let height = 0;
    let pixelRatio = 1;

    function shuffledPhrases() {
      const list = [...phrases];

      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }

      return list;
    }

    function makeHeart() {
      const scale = Math.min((width * 0.88) / 32, (height * 0.62) / 34);
      const centerX = width / 2;
      const centerY = height * 0.53;
      const points = [];

      for (let i = 0; i < 720; i++) {
        const angle = (2 * Math.PI * i) / 720;
        const x = 16 * Math.sin(angle) ** 3;
        const y =
          13 * Math.cos(angle) -
          5 * Math.cos(2 * angle) -
          2 * Math.cos(3 * angle) -
          Math.cos(4 * angle);

        points.push({
          x: centerX + x * scale,
          y: centerY - y * scale
        });
      }

      const minY = Math.min(...points.map(point => point.y));
      const maxY = Math.max(...points.map(point => point.y));
      const rowGap = Math.max(15, scale * 1.25);
      let phraseList = shuffledPhrases();
      let phraseIndex = 0;

      function nextPhrase() {
        if (phraseIndex >= phraseList.length) {
          phraseList = shuffledPhrases();
          phraseIndex = 0;
        }

        return phraseList[phraseIndex++];
      }

      words = [];

      for (let y = minY + rowGap / 2; y < maxY; y += rowGap) {
        const intersections = [];

        for (let i = 0; i < points.length; i++) {
          const a = points[i];
          const b = points[(i + 1) % points.length];

          if ((a.y <= y && b.y > y) || (b.y <= y && a.y > y)) {
            const x = a.x + ((y - a.y) * (b.x - a.x)) / (b.y - a.y);
            intersections.push(x);
          }
        }

        intersections.sort((a, b) => a - b);

        for (let i = 0; i + 1 < intersections.length; i += 2) {
          const left = intersections[i] + 5;
          const right = intersections[i + 1] - 5;
          let x = left;
          const row = [];

          while (x < right) {
            const text = nextPhrase();
            const size = Math.max(10, scale * (0.53 + Math.random() * 0.12));

            ctx.font = `bold ${size}px Arial`;
            const textWidth = ctx.measureText(text).width;

            if (x + textWidth > right) {
              break;
            }

            row.push({
              x: x + textWidth / 2,
              y,
              text,
              size,
              textWidth,
              glow: Math.random() * Math.PI * 2
            });

            x += textWidth + Math.max(5, scale * 0.3);
          }

          if (row.length > 0) {
            const usedWidth = x - left;
            const shift = (left + right - usedWidth) / 2 - left;

            for (const word of row) {
              word.x += shift;
              words.push(word);
            }
          }
        }
      }

      words.forEach((word, index) => {
        word.delay = (index / Math.max(1, words.length - 1)) * 8500;
      });
    }

    function resize() {
      pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * pixelRatio;
      canvas.height = height * pixelRatio;
      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

      makeHeart();
      startedAt = performance.now();
    }

    function draw(now) {
      ctx.clearRect(0, 0, width, height);
      const elapsed = now - startedAt;

      for (const word of words) {
        const age = elapsed - word.delay;

        if (age < 0) continue;

        const progress = Math.min(age / 700, 1);
        const eased = 1 - (1 - progress) ** 3;
        const lift = (1 - eased) * Math.max(18, word.size * 1.6);
        const shimmer = elapsed > 9000
          ? Math.max(0, Math.sin(now / 280 + word.glow)) ** 12
          : 0;

        ctx.save();
        ctx.globalAlpha = eased;
        ctx.font = `bold ${word.size}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.shadowColor = "#ff174f";
        ctx.shadowBlur = 5 + shimmer * 18;
        ctx.fillStyle = shimmer > 0.65 ? "#ffd1dc" : "#f51d47";
        ctx.fillText(word.text, word.x, word.y + lift);
        ctx.restore();
      }

      requestAnimationFrame(draw);
    }

    window.addEventListener("resize", resize);
    resize();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
